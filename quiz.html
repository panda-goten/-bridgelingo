<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f3ee">
<title>BridgeLingo Quiz v0.2</title>
<style>
:root{--bg:#f7f3ee;--card:#fff;--text:#29241f;--muted:#776f67;--line:#ded6ce;--accent:#8b5e3c;--soft:#f1e7dd;--blue:#1688e8;--ok:#e7f4e8;--ng:#fbe8e5}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}
header{position:sticky;top:0;z-index:20;padding:max(16px,env(safe-area-inset-top)) 14px 12px;background:#f7f3eef3;border-bottom:1px solid var(--line);backdrop-filter:blur(12px)}
h1{margin:0;font-size:27px}.sub,.small{color:var(--muted);font-size:12px}.nav{display:flex;gap:8px;margin-top:10px}.nav a{text-decoration:none;color:var(--text);background:var(--soft);padding:8px 12px;border-radius:999px;font-size:13px}.nav a.active{background:var(--accent);color:#fff}
main{max-width:760px;margin:auto;padding:14px 12px 50px}.panel,.quiz-card,.result{background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:0 8px 24px #3c2a1c14}.panel{padding:16px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:flex;flex-direction:column;gap:6px}.field.full{grid-column:1/-1}label{font-size:12px;color:var(--muted);font-weight:700}
select,button{font:inherit;border:0;border-radius:14px;padding:12px;background:var(--soft);color:var(--text)}select{width:100%}.primary{width:100%;margin-top:14px;background:var(--accent);color:#fff;font-weight:700;font-size:16px}.note{margin-top:10px;color:var(--muted);font-size:12px;line-height:1.55}
.quiz-wrap{display:none}.progress{display:flex;justify-content:space-between;margin:2px 2px 10px;color:var(--muted);font-size:13px}.quiz-card{padding:18px}.prompt-label{font-size:12px;color:var(--accent);font-weight:700;margin-bottom:10px}
.source-block{padding:13px 14px;border-radius:14px;background:#fffdfa;border:1px solid var(--line);margin-bottom:10px}.source-name{font-size:11px;color:var(--muted);font-weight:700}.source-text{font-size:21px;font-weight:700;margin-top:4px;line-height:1.45}.source-pron{font-size:14px;color:var(--muted);margin-top:3px}
.question{font-size:16px;font-weight:700;margin:18px 0 10px}.choices{display:grid;gap:10px}.choice{text-align:left;background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;font-size:17px;line-height:1.45}.choice.correct{background:var(--ok);border-color:#9ec7a2}.choice.wrong{background:var(--ng);border-color:#d9a49c}
.feedback{display:none;margin-top:14px;padding:12px 13px;border-radius:14px;background:var(--soft)}.feedback strong{display:block;margin-bottom:4px}.answer-pron{font-size:13px;color:var(--muted);margin-top:4px}.next{display:none;width:100%;margin-top:12px;background:var(--accent);color:#fff;font-weight:700}
.result{display:none;padding:24px;text-align:center}.score{font-size:44px;font-weight:800;color:var(--blue);margin:10px 0}.result-actions{display:grid;gap:10px;margin-top:18px}.result-actions button,.result-actions a{display:block;text-decoration:none;text-align:center;border-radius:14px;padding:12px;background:var(--soft);color:var(--text)}.result-actions .again{background:var(--accent);color:#fff}
.error{display:none;background:var(--ng);border:1px solid #d9a49c;border-radius:14px;padding:12px;margin-bottom:12px}
@media(max-width:540px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
<h1>BridgeLingo Quiz</h1>
<div class="sub">2言語 → 3言語目を四択　v0.2</div>
<div class="nav"><a href="index.html">語学図鑑</a><a class="active" href="quiz.html">クイズ</a></div>
</header>
<main>
<div id="error" class="error"></div>
<section id="setup" class="panel">
<div class="grid">
<div class="field"><label for="source1">表示する言語①</label><select id="source1"></select></div>
<div class="field"><label for="source2">表示する言語②</label><select id="source2"></select></div>
<div class="field"><label for="answerLang">答える言語</label><select id="answerLang"></select></div>
<div class="field"><label for="questionCount">問題数</label><select id="questionCount"><option value="5">5問</option><option value="10" selected>10問</option><option value="20">20問</option></select></div>
<div class="field full"><label for="category">カテゴリ</label><select id="category"><option value="">すべてのカテゴリ</option></select></div>
</div>
<button id="start" type="button" class="primary">クイズを始める</button>
<div class="note">問題順と正解の位置は毎回ランダムです。選択肢はdata.jsの100語から作ります。</div>
</section>

<section id="quizWrap" class="quiz-wrap">
<div class="progress"><span id="progressText"></span><span id="scoreText"></span></div>
<div class="quiz-card">
<div class="prompt-label">この2つと同じ意味になる表現は？</div>
<div class="source-block"><div id="sourceName1" class="source-name"></div><div id="sourceText1" class="source-text"></div><div id="sourcePron1" class="source-pron"></div></div>
<div class="source-block"><div id="sourceName2" class="source-name"></div><div id="sourceText2" class="source-text"></div><div id="sourcePron2" class="source-pron"></div></div>
<div id="question" class="question"></div>
<div id="choices" class="choices"></div>
<div id="feedback" class="feedback"></div>
<button id="next" type="button" class="next">次の問題へ</button>
</div>
</section>

<section id="result" class="result">
<div class="small">RESULT</div><div id="finalScore" class="score"></div><div id="finalMessage"></div>
<div class="result-actions"><button id="again" type="button" class="again">同じ設定でもう一度</button><button id="backSetup" type="button">設定を変える</button><a href="index.html">語学図鑑へ戻る</a></div>
</section>
</main>

<script src="data.js"></script>
<script>
(function(){
"use strict";

var LANGS={
 ja:{name:"日本語",text:"ja",pron:null},
 en:{name:"英語",text:"en",pron:null},
 zh_cn:{name:"普通話",text:"zh_cn",pron:"pinyin"},
 zh_tw:{name:"台湾華語",text:"zh_tw",pron:"zhuyin"},
 nan:{name:"台湾語",text:"nan",pron:"tailo"},
 is:{name:"アイスランド語",text:"is",pron:null}
};

function el(id){return document.getElementById(id)}
var source1=el("source1"),source2=el("source2"),answerLang=el("answerLang");
var questionCount=el("questionCount"),category=el("category");
var settings=null,questions=[],current=0,score=0,answered=false;

function shuffle(arr){
 var a=arr.slice(),i,j,t;
 for(i=a.length-1;i>0;i--){j=Math.floor(Math.random()*(i+1));t=a[i];a[i]=a[j];a[j]=t}
 return a
}
function addOption(select,value,text){var o=document.createElement("option");o.value=value;o.textContent=text;select.appendChild(o)}
function textOf(item,key){return item[LANGS[key].text]||""}
function pronOf(item,key){var p=LANGS[key].pron;return p?(item[p]||""):""}
function showError(message){el("error").textContent=message;el("error").style.display="block"}

function init(){
 try{
   if(typeof DATA==="undefined" || !Array.isArray(DATA)){throw new Error("data.jsが読み込めませんでした。")}
   Object.keys(LANGS).forEach(function(key){
     addOption(source1,key,LANGS[key].name);addOption(source2,key,LANGS[key].name);addOption(answerLang,key,LANGS[key].name)
   });
   source1.value="ja";source2.value="zh_cn";answerLang.value="en";
   Array.from(new Set(DATA.map(function(x){return x.category}))).forEach(function(c){addOption(category,c,c)});
   el("start").addEventListener("click",function(){startQuiz(false)});
   el("next").addEventListener("click",nextQuestion);
   el("again").addEventListener("click",function(){startQuiz(true)});
   el("backSetup").addEventListener("click",showSetup);
 }catch(err){
   showError("初期化エラー：" + err.message);
 }
}

function startQuiz(reuse){
 try{
   if(!reuse){
     var langs=[source1.value,source2.value,answerLang.value];
     if(new Set(langs).size!==3){alert("3つの言語は別々に選んでください。");return}
     settings={source1:source1.value,source2:source2.value,answer:answerLang.value,count:Number(questionCount.value),category:category.value}
   }
   var pool=DATA.filter(function(x){
     return (!settings.category||x.category===settings.category)&&textOf(x,settings.source1)&&textOf(x,settings.source2)&&textOf(x,settings.answer)
   });
   if(pool.length<4){alert("この設定では語彙が足りません。カテゴリを広げてください。");return}
   questions=shuffle(pool).slice(0,Math.min(settings.count,pool.length));
   current=0;score=0;answered=false;
   el("setup").style.display="none";el("result").style.display="none";el("quizWrap").style.display="block";
   renderQuestion();
   window.scrollTo(0,0);
 }catch(err){
   showError("クイズ開始時のエラー：" + err.message);
 }
}

function renderSource(item,key,n){
 el("sourceName"+n).textContent=LANGS[key].name;
 el("sourceText"+n).textContent=textOf(item,key);
 var p=pronOf(item,key);el("sourcePron"+n).textContent=p;el("sourcePron"+n).style.display=p?"block":"none"
}

function renderQuestion(){
 var item=questions[current],wrongPool,wrongs,options,choices;
 answered=false;
 el("progressText").textContent=(current+1)+" / "+questions.length;
 el("scoreText").textContent="正解 "+score;
 renderSource(item,settings.source1,1);renderSource(item,settings.source2,2);
 el("question").textContent=LANGS[settings.answer].name+"はどれ？";
 el("feedback").style.display="none";el("feedback").innerHTML="";el("next").style.display="none";
 wrongPool=DATA.filter(function(x){return x.id!==item.id&&textOf(x,settings.answer)});
 wrongs=shuffle(wrongPool).slice(0,3);options=shuffle([item].concat(wrongs));
 choices=el("choices");choices.innerHTML="";
 options.forEach(function(opt){
   var b=document.createElement("button");b.type="button";b.className="choice";b.textContent=textOf(opt,settings.answer);b.setAttribute("data-id",opt.id);
   b.addEventListener("click",function(){choose(b,opt,item)});choices.appendChild(b)
 });
}

function choose(button,selected,correct){
 if(answered)return;answered=true;
 var ok=selected.id===correct.id;if(ok)score++;
 Array.prototype.forEach.call(document.querySelectorAll(".choice"),function(b){
   b.disabled=true;
   if(b.getAttribute("data-id")===correct.id)b.classList.add("correct");
   else if(b===button)b.classList.add("wrong")
 });
 var p=pronOf(correct,settings.answer);
 el("feedback").style.display="block";
 el("feedback").innerHTML="<strong>"+(ok?"正解！🎉":"おしい！ 正解はこちら")+"</strong><div>"+textOf(correct,settings.answer)+"</div>"+(p?'<div class="answer-pron">'+p+"</div>":"");
 el("scoreText").textContent="正解 "+score;
 el("next").textContent=current===questions.length-1?"結果を見る":"次の問題へ";
 el("next").style.display="block"
}

function nextQuestion(){current++;if(current>=questions.length)showResult();else renderQuestion()}
function showResult(){
 el("quizWrap").style.display="none";el("result").style.display="block";el("finalScore").textContent=score+" / "+questions.length;
 var rate=score/questions.length,msg="まずはここから！";
 if(rate===1)msg="全問正解！すごい！！✨";else if(rate>=.8)msg="かなり身についてる！👏";else if(rate>=.6)msg="いい感じ！もう一周で定着しそう😊";else if(rate>=.4)msg="語学図鑑で確認して、また挑戦しよう。";
 el("finalMessage").textContent=msg;window.scrollTo(0,0)
}
function showSetup(){el("result").style.display="none";el("quizWrap").style.display="none";el("setup").style.display="block";window.scrollTo(0,0)}

if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",init);else init();
})();
</script>
</body>
</html>

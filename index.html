<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f3ee">
<title>BridgeLingo v0.6</title>
<style>
:root{--bg:#f7f3ee;--card:#fff;--text:#29241f;--muted:#776f67;--line:#ded6ce;--accent:#8b5e3c;--soft:#f1e7dd;--blue:#1688e8}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}
header{position:sticky;top:0;z-index:20;padding:max(16px,env(safe-area-inset-top)) 14px 12px;background:#f7f3eef3;border-bottom:1px solid var(--line);backdrop-filter:blur(12px)}
.head{display:flex;justify-content:space-between;align-items:end;gap:10px} h1{margin:0;font-size:27px} .sub,.count,.hint,.note,.picker-label{color:var(--muted);font-size:12px}
.search{width:100%;margin-top:12px;padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:#fff;font-size:16px}
.picker,.tools{display:flex;gap:7px;overflow:auto;margin-top:8px;padding-bottom:1px} .picker-label{margin-top:10px}
button,select{border:0;border-radius:999px;padding:9px 12px;background:var(--soft);font-size:14px;white-space:nowrap;color:var(--text)} .lang-btn.on{background:var(--accent);color:#fff} select{border-radius:12px}
main{max-width:760px;margin:auto;padding:14px 12px 40px} .hint{margin:0 2px 8px} .note{margin:0 2px 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;margin-bottom:13px;overflow:hidden;box-shadow:0 8px 24px #3c2a1c14}
.summary{width:100%;padding:16px;text-align:left;background:transparent;border-radius:0} .top{display:flex;justify-content:space-between;gap:10px} .ja{font-size:22px;font-weight:700;color:var(--blue)} .arrow{color:var(--muted)} .card.open .arrow{transform:rotate(180deg)}
.preview{margin-top:9px} .preview-line,.lang{display:grid;grid-template-columns:62px 1fr;gap:7px;margin-top:6px;line-height:1.45} .lab{color:var(--muted);font-size:12px;padding-top:3px}
.detail{display:none;padding:16px;border-top:1px solid var(--line);background:#fffdfa} .card.open .detail{display:block}
.group-title{margin-top:13px;color:var(--accent);font-size:11px;font-weight:700} .pron{margin-left:69px;color:var(--muted);font-size:14px;line-height:1.5}
.zhuyin{font-family:"PingFang TC","Heiti TC","Noto Sans Bopomofo","Noto Sans TC",sans-serif;font-size:16px;letter-spacing:.08em}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px} .chip{padding:5px 8px;border-radius:999px;background:var(--soft);color:var(--muted);font-size:12px}
.hidden{display:none!important} .empty{display:none;text-align:center;color:var(--muted);padding:50px}
</style>
</head>
<body>
<header>
<div class="head"><div><h1>BridgeLingo</h1><div class="sub">語学図鑑 v0.6・データ分離版</div></div><div id="count" class="count"></div></div>
<input id="q" class="search" type="search" placeholder="言語・発音表記・カテゴリ・タグから検索">
<div class="picker-label">表示する言語</div>
<div class="picker">
<button class="lang-btn on" data-lang="en">英語</button>
<button class="lang-btn on" data-lang="zh_cn">普通話</button>
<button class="lang-btn on" data-lang="zh_tw">台湾華語</button>
<button class="lang-btn on" data-lang="nan">台湾語</button>
<button class="lang-btn on" data-lang="is">アイスランド語</button>
</div>
<div class="tools">
<select id="category"><option value="">すべてのカテゴリ</option></select>
<button id="openAll">すべて開く</button>
<button id="closeAll">すべて閉じる</button>
<button id="clear">リセット</button>
</div>
</header>
<main>
<div class="hint">カードをタップすると、選択中の全言語と発音表記が開きます。</div>
<div class="note">台湾語は地域差が大きいため、現段階では学習用の暫定表現です。</div>
<div id="list"></div><div id="empty" class="empty">該当する表現がありません。</div>
</main>
<script src="data.js"></script>
<script>
var visible={en:true,zh_cn:true,zh_tw:true,nan:true,is:true};
var q=document.getElementById("q"),list=document.getElementById("list"),count=document.getElementById("count"),empty=document.getElementById("empty"),category=document.getElementById("category");

function esc(s){return String(s||"").replace(/[&<>"']/g,function(m){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]})}
function norm(s){return String(s||"").toLowerCase().normalize("NFKD").replace(/[\u0300-\u036f]/g,"")}
function searchable(x){return norm([x.id,x.category,x.ja,x.en,x.zh_cn,x.pinyin,x.zh_tw,x.zhuyin,x.nan,x.tailo,x.is,x.tags.join(" ")].join(" "))}
function cls(k){return visible[k]?"":" hidden"}
function row(k,label,text){return '<div class="lang lang-'+k+cls(k)+'"><div class="lab">'+label+'</div><div>'+esc(text)+'</div></div>'}
function pron(k,text,z){return '<div class="pron lang-'+k+cls(k)+(z?' zhuyin':'')+'">'+esc(text)+'</div>'}

function makeCard(x){
 var a=document.createElement("article"); a.className="card";
 a.innerHTML='<button class="summary" type="button"><div class="top"><div class="ja">'+esc(x.ja)+'</div><div class="arrow">⌄</div></div>'+
 '<div class="preview">'+
 (visible.en?'<div class="preview-line"><div class="lab">EN</div><div>'+esc(x.en)+'</div></div>':'')+
 (visible.zh_cn?'<div class="preview-line"><div class="lab">中文</div><div>'+esc(x.zh_cn)+'</div></div>':'')+
 '</div></button>'+
 '<div class="detail">'+
 row("en","EN",x.en)+
 '<div class="group-title lang-zh_cn'+cls("zh_cn")+'">中国語（普通話）</div>'+row("zh_cn","簡体",x.zh_cn)+pron("zh_cn",x.pinyin,false)+
 '<div class="group-title lang-zh_tw'+cls("zh_tw")+'">台湾華語</div>'+row("zh_tw","繁体",x.zh_tw)+pron("zh_tw",x.zhuyin,true)+
 '<div class="group-title lang-nan'+cls("nan")+'">台湾語</div>'+row("nan","台語",x.nan)+pron("nan",x.tailo,false)+
 row("is","ÍS",x.is)+
 '<div class="chips"><span class="chip">'+esc(x.category)+'</span>'+x.tags.map(function(t){return '<span class="chip">#'+esc(t)+'</span>'}).join("")+'<span class="chip">'+esc(x.id)+'</span></div></div>';
 a.querySelector(".summary").onclick=function(){a.classList.toggle("open")};
 return a
}

function render(){
 var z=norm(q.value.trim()),cat=category.value;
 var arr=DATA.filter(function(x){return (!z||searchable(x).includes(z))&&(!cat||x.category===cat)});
 list.innerHTML=""; arr.forEach(function(x){list.appendChild(makeCard(x))});
 count.textContent=arr.length+"件"; empty.style.display=arr.length?"none":"block";
}

[...new Set(DATA.map(function(x){return x.category}))].forEach(function(c){category.add(new Option(c,c))});
q.oninput=render; category.onchange=render;
document.querySelectorAll(".lang-btn").forEach(function(b){b.onclick=function(){var k=b.dataset.lang;visible[k]=!visible[k];b.classList.toggle("on",visible[k]);render()}});
document.getElementById("openAll").onclick=function(){document.querySelectorAll(".card").forEach(function(c){c.classList.add("open")})};
document.getElementById("closeAll").onclick=function(){document.querySelectorAll(".card").forEach(function(c){c.classList.remove("open")})};
document.getElementById("clear").onclick=function(){q.value="";category.value="";render();q.focus()};
render();
</script>
</body>
</html>

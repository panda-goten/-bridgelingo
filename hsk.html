<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7f3fb"><title>BridgeLingo HSK単語帳</title><style>
:root{--bg:#f7f3fb;--card:#fff;--text:#2f2938;--muted:#786f86;--line:#ddd4ea;--accent:#7b5aa6;--soft:#eee7f6;--blue:#6e57d2}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}header{position:sticky;top:0;z-index:20;padding:max(16px,env(safe-area-inset-top)) 14px 12px;background:#f7f3fbf3;border-bottom:1px solid var(--line);backdrop-filter:blur(12px)}h1{margin:0;font-size:27px}.sub,.count,.hint{color:var(--muted);font-size:12px}.head{display:flex;justify-content:space-between;align-items:end;gap:10px}.nav{display:flex;gap:8px;margin-top:10px;overflow:auto}.nav a{text-decoration:none;color:var(--text);background:var(--soft);padding:8px 12px;border-radius:999px;font-size:13px;white-space:nowrap}.nav a.active{background:var(--accent);color:#fff}.search{width:100%;margin-top:12px;padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:#fff;font-size:16px}main{max-width:760px;margin:auto;padding:14px 12px 50px}.hint{margin:0 2px 12px;line-height:1.6}.card{background:var(--card);border:1px solid var(--line);border-radius:20px;margin-bottom:13px;overflow:hidden;box-shadow:0 8px 24px #4f3a6b14}.summary{width:100%;padding:16px;text-align:left;background:transparent;border:0}.top{display:flex;justify-content:space-between;gap:12px;align-items:start}.word{font-size:25px;font-weight:800;color:var(--blue)}.arrow{color:var(--muted)}.card.open .arrow{transform:rotate(180deg)}.pinyin{font-size:15px;color:var(--accent);margin-top:4px}.meaning{font-size:15px;margin-top:7px}.detail{display:none;padding:16px;border-top:1px solid var(--line);background:#fcf9ff}.card.open .detail{display:block}.section-title{font-size:11px;color:var(--accent);font-weight:700;letter-spacing:.08em;margin-bottom:6px}.example{font-size:17px;line-height:1.65}.example-pinyin,.example-ja{color:var(--muted);font-size:13px;line-height:1.6;margin-top:5px}.audio-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.speak{border:0;border-radius:999px;padding:9px 12px;background:var(--soft);color:var(--text);font-size:13px}.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:13px}.chip{font-size:11px;color:var(--muted);background:var(--soft);padding:5px 8px;border-radius:999px}.empty{display:none;text-align:center;color:var(--muted);padding:50px}
</style></head><body><header><div class="head"><div><h1>BridgeLingo HSK</h1><div class="sub">HSK5級レベル・試作20語</div></div><div id="count" class="count"></div></div><div class="nav"><a href="index.html">語学図鑑</a><a class="active" href="hsk.html">HSK単語帳</a><a href="quiz.html">クイズ</a><a href="appendix.html">付録</a></div><input id="q" class="search" type="search" placeholder="単語・拼音・意味・例文・タグから検索"></header><main><p class="hint">20語の試作版です。カードを開くと例文が見られます。🔊はiPhone／ブラウザの中国語音声（zh-CN）で単語と例文を読み上げます。</p><div id="list"></div><div id="empty" class="empty">該当する単語がありません。</div></main><script src="hsk-data.js"></script><script>
var q=document.getElementById("q"),list=document.getElementById("list"),count=document.getElementById("count"),empty=document.getElementById("empty");function esc(s){return String(s||"").replace(/[&<>"']/g,function(m){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]})}function norm(s){return String(s||"").toLowerCase().normalize("NFKD").replace(/[\u0300-\u036f]/g,"")}function searchable(x){return norm([x.word,x.pinyin,x.meaning,x.example,x.example_pinyin,x.example_ja,x.tags.join(" ")].join(" "))}
function speakChinese(text){if(!("speechSynthesis" in window)){alert("このブラウザは音声読み上げに対応していません。");return}window.speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(text);u.lang="zh-CN";u.rate=.86;var voices=window.speechSynthesis.getVoices();var v=voices.find(function(x){return /^zh[-_]CN/i.test(x.lang)})||voices.find(function(x){return /^zh/i.test(x.lang)});if(v)u.voice=v;window.speechSynthesis.speak(u)}
function makeCard(x){var a=document.createElement("article");a.className="card";a.innerHTML='<button type="button" class="summary"><div class="top"><div><div class="word">'+esc(x.word)+'</div><div class="pinyin">'+esc(x.pinyin)+'</div><div class="meaning">'+esc(x.meaning)+'</div></div><div class="arrow">⌄</div></div></button><div class="detail"><div class="section-title">EXAMPLE</div><div class="example">'+esc(x.example)+'</div><div class="example-pinyin">'+esc(x.example_pinyin)+'</div><div class="example-ja">'+esc(x.example_ja)+'</div><div class="audio-row"><button type="button" class="speak" data-text="'+esc(x.word)+'">🔊 単語</button><button type="button" class="speak" data-text="'+esc(x.example)+'">🔊 例文</button></div><div class="chips">'+x.tags.map(function(t){return '<span class="chip">#'+esc(t)+'</span>'}).join("")+'<span class="chip">'+esc(x.id)+'</span></div></div>';a.querySelector(".summary").onclick=function(){a.classList.toggle("open")};return a}
function render(){var z=norm(q.value.trim()),arr=HSK_DATA.filter(function(x){return !z||searchable(x).includes(z)});list.innerHTML="";arr.forEach(function(x){list.appendChild(makeCard(x))});count.textContent=arr.length+"語";empty.style.display=arr.length?"none":"block"}q.oninput=render;document.addEventListener("click",function(e){var b=e.target.closest(".speak");if(!b)return;e.preventDefault();e.stopPropagation();speakChinese(b.getAttribute("data-text")||"")});if(window.speechSynthesis){window.speechSynthesis.onvoiceschanged=function(){window.speechSynthesis.getVoices()}}render();
</script></body></html>
